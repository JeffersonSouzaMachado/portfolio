    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        html,
        body {
          margin: 0;
          width: 100%;
          height: 100%;
          background-color: #0F172A;
        }

        #loading-screen {
          position: fixed;
          inset: 0;

          display: flex;
          align-items: center;
          justify-content: center;

          background-color: #0F172A;
        }

        .loading-title {
          font-family: 'Outfit', sans-serif;
          font-size: 40px;
          font-weight: 500;
          color: #BEC6E0;

          animation: opacity-animation 1.5s ease-in-out infinite;
        }

        @keyframes opacity-animation {
          0% {
            opacity: 0.2;
          }

          50% {
            opacity: 1;
          }

          100% {
            opacity: 0.2;
          }


        }
        .loading-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 24px;
        }

        .loading-bar {
          width: 180px;
          height: 3px;
          overflow: hidden;
          border-radius: 999px;
          background-color: rgba(190, 198, 224, 0.15);
        }

        .loading-progress {
          width: 40%;
          height: 100%;
          border-radius: 999px;
          background-color: #BEC6E0;

          animation: loading-bar-animation 1.2s ease-in-out infinite;
        }

        @keyframes loading-bar-animation {
          0% {
            transform: translateX(-120%);
          }

          100% {
            transform: translateX(350%);
          }
        }


      @font-face {
      font-family: 'Outfit';
      src: url('fonts/Outfit-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    </style>

    <script>

        console.log(

        console.log(
          "%cHi there, welcome to my console! 👋",
          `

            font-size: 18px;

          `
        );
          console.log(
          "%c----------------------------------------",
          `

        console.log(

        console.log(

  console.log(

        );

        console.log(
          "%chttps://github.com/JeffersonSouzaMachado",

            color: #22C55E;
            font-size: 14px;
            text-decoration: underline;
          `

    </script>
</head>
<body>
<!--
  You can customize the "flutter_bootstrap.js" script.
  This is useful to provide a custom configuration to the Flutter loader
  or to give the user feedback during the initialization process.

  For more details:
  * https://docs.flutter.dev/platform-integration/web/initialization
-->
<div id="loading-screen">
    <div class="loading-content">
        <span class="loading-title">theDevJeff</span>

        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>
</div>
<script>
    window.addEventListener('flutter-first-frame', function () {
      const loadingScreen = document.getElementById('loading-screen');

      if (loadingScreen) {
        loadingScreen.remove();
      }
    });
</script>


<script src="flutter_bootstrap.js" async></script>
</body>
